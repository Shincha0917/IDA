<!DOCTYPE html>
<html>
    <head>
        <title>Canvas Test</title>
        <script>
            //canvas の中身を指し示すもの
            let ctx;
            //canvas の width 幅
            let cw;
            //canvasの height 高さ
            let ch;

            //初期化処理
            function init(){
                //ID が mycanvas のものを canvas という変数にいれておく
                let canvas = document.getElementById('mycanvas');
                //canvas が存在しないか、canvas の中身がなければ処理終了
                if(!canvas ||!canvas.getContext){
                    return false;
            }
            //canvas の中身を指し示すものを代入
            ctx = canvas.getContext('2d');
            //canvas の幅・高さを代入しておく
            cw = canvas.width;
            ch = canvas.height;

            //実際の描画処理
            draw();
        }

        function draw(){
            //塗の色を設定
            ctx.fillStyle = "rgba(255,0,0,1)";

            //長方形の絵画
            ctx.fillRect(10,10,50,50); //左上のx,y 座標,幅,高さ
        }
        
        </script>
    </head>
    <body onload="init();">
        <H1>Canvas Test</H1>
        <canvas id="mycanvas" width="1000" height="800"></canvas>
    </body>    
</html>
